<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>roomform debug viewer</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#1c1e22; color:#ddd;
                font:12px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif; }
    #scene { position:fixed; inset:0; }
    #panel { position:fixed; z-index:10; left:10px; top:10px; bottom:10px; width:280px; overflow:auto;
             background:rgba(30,32,38,.92); border:1px solid #333; border-radius:12px; padding:10px; }
    h2 { margin:10px 0 4px; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#8a8f98; }
    label.grp { display:flex; gap:6px; align-items:center; padding:2px 0; cursor:pointer; }
    .dot { width:8px; height:8px; border-radius:50%; flex:none; }
    .scene-link { display:block; width:100%; border:0; background:transparent; color:#ccc; text-align:left;
                  padding:3px 6px; border-radius:6px; cursor:pointer; font:11px ui-monospace,monospace; }
    .scene-link:hover { background:#2c2f36; }
    .scene-link.active { background:#3a4a68; color:#fff; }
    .obj { padding:2px 6px; font:10px ui-monospace,monospace; color:#bbb; cursor:pointer; border-radius:4px; }
    .obj:hover { background:#2c2f36; }
    .obj.selected { background:#3a4a68; color:#fff; }
    .obj .flag { color:#e06666; }
    .title { padding:4px 4px 10px; border-bottom:1px solid #3a3d44; }
    .title strong { display:block; color:#fff; font-size:14px; }
    .title span { color:#9aa; }
    #hint { padding:6px 4px 0; color:#778; font-size:10px; line-height:1.5; }
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
</head>
<body>
<div id="scene"></div>
<div id="panel">
  <div class="title"><strong>roomform debug</strong><span id="subtitle">pick a scene</span></div>
  <div id="hint">read-only inspection &middot; click box or row to highlight &middot; esc clears</div>
  <h2>scenes</h2><div id="scenes"></div>
  <h2>layers</h2><div id="groups"></div>
  <h2>objects</h2><div id="objects"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.getElementById('scene').appendChild(renderer.domElement);
const scene3 = new THREE.Scene();
scene3.background = new THREE.Color(0x1c1e22);
scene3.add(new THREE.AmbientLight(0xffffff, 1.2));
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(5, -3, 8);
scene3.add(dir);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 500);
camera.position.set(8, -8, 6); camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene3, camera); })();

let current = null;      // GLB root
let rgbCloud = null;     // full-res display cloud
let doc = null;          // scene.json
let sceneName = null;
let boxGroup = null;     // editable object boxes
let boxes = [];          // one Group per object
let selected = -1;

function setHighlight(i, on) {
  if (i < 0) return;
  const line = boxes[i].userData.line;
  line.material.color.set(on ? 0xffffff : boxes[i].userData.color);
}

function select(i) {
  setHighlight(selected, false);
  selected = i;
  setHighlight(i, true);
  document.querySelectorAll('.obj').forEach((el, k) => {
    el.classList.toggle('selected', k === i);
    if (k === i) el.scrollIntoView({ block: 'nearest' });
  });
}

function makeBox(o, i) {
  const g = new THREE.Group();
  g.position.set(...o.center);
  g.rotation.z = o.heading || 0;
  const geo = new THREE.BoxGeometry(...o.size);
  const leak = (o.qa && o.qa.wall_leak_pts) || 0;
  const color = leak > 50 ? 0xe05050 : 0xe6a03c;
  const fill = new THREE.Mesh(geo,
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.07, depthWrite: false }));
  fill.userData.index = i;
  g.add(fill);
  const line = new THREE.LineSegments(new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color }));
  g.add(line);
  g.userData.line = line;
  g.userData.color = color;
  return g;
}


async function loadScene(name) {
  document.querySelectorAll('.scene-link').forEach(el =>
    el.classList.toggle('active', el.dataset.name === name));
  select(-1);
  if (current) { scene3.remove(current); current = null; }
  if (boxGroup) { scene3.remove(boxGroup); boxGroup = null; }
  if (rgbCloud) { scene3.remove(rgbCloud); rgbCloud = null; }
  sceneName = name;
  document.getElementById('subtitle').textContent = name;

  doc = await (await fetch(`/artifacts/${name}/scene.json`)).json();
  const gltf = await new GLTFLoader().loadAsync(`/artifacts/${name}/scene.glb`);
  current = gltf.scene;
  const baked = [];
  current.traverse(o => {
    if (o.isPoints) {
      o.material.size = 0.035;
      // object boxes are drawn live from scene.json — hide the baked ones
      if ((o.name || '').startsWith('objects')) baked.push(o);
    }
    if (o.isMesh) o.material.side = 2; // sheets visible from both sides
  });
  baked.forEach(o => o.removeFromParent());
  scene3.add(current);

  boxGroup = new THREE.Group();
  boxes = doc.objects.map((o, i) => {
    const g = makeBox(o, i);
    boxGroup.add(g);
    return g;
  });
  scene3.add(boxGroup);

  // adopted/reconstructed meshes are raw-frame; shift to grid frame and
  // attach inside each box group so edits carry the mesh along
  const meshLayer = { visible: true, items: [] };
  const fs = doc.frame_shift || [0, 0, 0];
  const meshLoader = new GLTFLoader();
  doc.objects.forEach((o, i) => {
    if (!o.mesh_path) return;
    meshLoader.loadAsync(`/artifacts/${name}/${o.mesh_path}`).then(g => {
      if (sceneName !== name) return; // scene switched mid-load
      const m = g.scene;
      m.position.set(-fs[0], -fs[1], -fs[2]);
      scene3.add(m);
      m.updateMatrixWorld(true);
      boxes[i].attach(m);
      m.visible = meshLayer.visible;
      meshLayer.items.push(m);
    });
  });

  const box = new THREE.Box3().setFromObject(current);
  const c = box.getCenter(new THREE.Vector3());
  controls.target.copy(c);
  camera.position.set(c.x + 9, c.y - 9, c.z + 7);

  const groups = [];
  current.traverse(o => { if (o.isPoints || o.isMesh) groups.push(o); });
  const gdiv = document.getElementById('groups');
  gdiv.innerHTML = '';

  // full-res RGB cloud, when the evidence stage wrote one; the voxel
  // evidence layer defaults off in its favor
  try {
    const head = await fetch(`/artifacts/${name}/cloud.ply`, { method: 'HEAD' });
    if (head.ok) {
      const geo = await new PLYLoader().loadAsync(`/artifacts/${name}/cloud.ply`);
      const cloud = new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.02, vertexColors: geo.hasAttribute('color') }));
      cloud.name = 'rgb cloud';
      if (sceneName === name) {
        rgbCloud = cloud;
        scene3.add(cloud);
        groups.unshift(cloud);
        const ev = groups.find(g => (g.name || '') === 'evidence');
        if (ev) ev.visible = false;
      }
    }
  } catch { /* no cloud — voxel evidence stays on */ }
  for (const g of groups) {
    const color = g.material.vertexColors
      ? '#cfcfcf' : '#' + g.material.color.getHexString();
    const label = document.createElement('label');
    label.className = 'grp';
    label.innerHTML = `<input type="checkbox"${g.visible ? ' checked' : ''}><span class="dot" style="background:${color}"></span>${g.name || g.parent.name}`;
    label.querySelector('input').onchange = e => { g.visible = e.target.checked; };
    gdiv.appendChild(label);
  }
  const boxLabel = document.createElement('label');
  boxLabel.className = 'grp';
  boxLabel.innerHTML = `<input type="checkbox" checked><span class="dot" style="background:#e6a03c"></span>object boxes`;
  boxLabel.querySelector('input').onchange = e => {
    boxGroup.visible = e.target.checked;
    if (!e.target.checked) select(-1);
  };
  gdiv.appendChild(boxLabel);
  if (doc.objects.some(o => o.mesh_path)) {
    const meshLabel = document.createElement('label');
    meshLabel.className = 'grp';
    meshLabel.innerHTML = `<input type="checkbox" checked><span class="dot" style="background:#7ec8a0"></span>object meshes`;
    meshLabel.querySelector('input').onchange = e => {
      meshLayer.visible = e.target.checked;
      meshLayer.items.forEach(m => { m.visible = e.target.checked; });
    };
    gdiv.appendChild(meshLabel);
  }

  renderObjectRows();
}

const scenes = await (await fetch('/api/scenes')).json();
const sdiv = document.getElementById('scenes');
for (const name of scenes) {
  const b = document.createElement('button');
  b.className = 'scene-link'; b.dataset.name = name; b.textContent = name;
  b.onclick = () => loadScene(name);
  sdiv.appendChild(b);
}
if (scenes.length) loadScene(scenes[0]);
</script>
</body>
</html>
