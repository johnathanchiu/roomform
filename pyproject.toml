[project]
name = "roomform"
version = "0.1.0"
description = "Indoor structure completion: scan -> tri-state evidence -> shell patch-graph -> scene document"
requires-python = ">=3.11"
dependencies = ["numpy", "pydantic>=2", "trimesh"]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pyyaml"]
agent = ["anthropic", "openai", "pydantic-settings", "httpx", "websockets", "google-genai"]
model = ["torch", "scipy"]
modal = ["modal"]

[tool.ruff]
line-length = 79

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roomform"]
