[project]
name = "roomform"
version = "0.1.0"
description = "Parses point cloud indoor scans into structured, editable scenes"
readme = "README.md"
authors = [
    {name = "Johnathan Chiu"},
    {name = "Matthew Zhou"},
    {name = "Preston Bourne"},
]
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = ["numpy", "pydantic>=2", "trimesh", "scikit-image"]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pyyaml"]
agent = ["anthropic", "openai", "pydantic-settings", "matplotlib"]
model = ["torch", "scipy"]
modal = ["modal"]
fal = ["fal-client>=0.5", "pillow>=10"]

[tool.ruff]
line-length = 79

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roomform"]
